name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'cli/package.json'
      - 'cli/bun.lockb'

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # TruffleHog is AGPL-3.0, but it is a CI scanner that runs in the Actions runner —
          # it is never linked into, bundled with, or distributed as part of DeepThink, so
          # the copyleft obligations the deny-list exists to prevent do not attach. Scoped to
          # this one action so the policy still applies to everything we actually ship.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
